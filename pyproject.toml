[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cli"
version = "0.2.0"
description = "Command-line AI chatbot using the OpenRouter API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "slawti" }]
dependencies = [
  "openai>=1.0.0",
  "python-dotenv>=1.0.0",
  "rich>=13.0.0",
  "prompt_toolkit>=3.0.0",
  "textual>=3.0.0",
]

[project.scripts]
ai-cli = "ai_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_cli*"]
